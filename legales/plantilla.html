<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1">
{{robots}}
<title>{{titulo}} | Level Up™ | AIMA</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
{{procedencia}}
<!--
  Tipografía del sistema a propósito, y NINGÚN recurso externo: es una página de
  privacidad. El sitio principal carga Archivo desde Google Fonts, y eso le manda
  la IP de cada visitante a Google. En la página que explica qué se hace con los
  datos de la gente, no se le avisa la visita a ningún tercero.
-->
<style>
:root{
  --void:#121110;--panel:#191817;
  --ink:#f2f0ec;--ink-2:rgba(242,240,236,.88);--mid:rgba(242,240,236,.66);
  --line:rgba(242,240,236,.14);--hot:#f26a1f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--void);color:var(--ink-2);
  font:16.5px/1.68 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}

.borrador{background:var(--hot);color:var(--void);font-weight:700;font-size:14px;
  text-align:center;padding:10px 16px;line-height:1.4}

.barra{border-bottom:1px solid var(--line)}
.barra a{display:block;max-width:72ch;margin:0 auto;padding:18px 22px;
  color:var(--ink);text-decoration:none;font-weight:800;letter-spacing:-.01em}
.barra a span{color:var(--hot)}

main{max-width:72ch;margin:0 auto;padding:48px 22px 88px}
.version{font-size:14px;color:var(--mid);margin:0 0 30px;padding-bottom:18px;
  border-bottom:1px solid var(--line)}
h1{color:var(--ink);font-size:clamp(23px,4.2vw,32px);line-height:1.2;
  letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
h1+p{color:var(--mid);font-size:14.5px;margin:0 0 36px}
h2{color:var(--ink);font-size:20px;line-height:1.3;margin:52px 0 14px}
h3{color:var(--ink);font-size:17px;margin:32px 0 10px}
h1,h2,h3{scroll-margin-top:24px}
p{margin:0 0 16px}
ul,ol{margin:0 0 18px;padding-left:22px}
li{margin:0 0 8px}
strong{color:var(--ink);font-weight:650}
em{color:var(--mid)}
a{color:var(--hot);text-underline-offset:3px}

/* las tablas legales son anchas: en el celular se desplazan dentro de su
   caja, nunca la página entera */
.tabla{overflow-x:auto;margin:0 0 22px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--panel);color:var(--ink);font-weight:650}

/* las notas van en un panel, sin borde de color al costado */
blockquote{margin:22px 0;padding:14px 18px;background:var(--panel);border-radius:8px}
blockquote p:last-child{margin:0}
hr{border:0;border-top:1px solid var(--line);margin:44px 0}

footer{border-top:1px solid var(--line)}
footer div{max-width:72ch;margin:0 auto;padding:24px 22px 40px;font-size:14px;color:var(--mid)}
footer a{color:var(--ink-2)}
footer nav{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:10px}
</style>
</head>
<body>
{{aviso_borrador}}
<header class="barra"><a href="/">Level Up<span>™</span> | AIMA</a></header>
<main>
{{version}}
{{contenido}}
</main>
<footer><div>
  <nav>
    <a href="/aima/agente/terminos/">Términos del servicio del agente</a>
    <a href="/aima/privacidad/">Política de privacidad de AIMA</a>
  </nav>
  Level Up™ | AIMA · Reconquista, Santa Fe
</div></footer>
</body>
</html>
